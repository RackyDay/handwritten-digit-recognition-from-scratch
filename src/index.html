<!DOCTYPE html>
<html>

<head>
    <title>DigitGuessr</title>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: #FBF5F3;
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            align-items: center;  
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #bbbbbb;
            margin-bottom: 50px;
        }

        .pipeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        .card {
            background: #1b1b1b;
            border: 1px solid #2e2e2e;
            border-radius: 15px;
            padding: 25px;
            width: 340px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        canvas,
        #processed_image {
            border: 2px solid #FBF5F3;
            image-rendering: pixelated;
            background: black;
        }

        button {
            margin-top: 20px;
            padding: 10px 22px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #3772FF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2c5fda;
            transition: background-color 0.1s ease-in-out;
        }

        .arrow {
            font-size: 48px;
            color: #3772FF;
            font-weight: bold;
        }

        .caption {
            margin-top: 15px;
            color: #9f9f9f;
        }

        .prediction-card {
            min-height: 400px;
        }

        .track {
            width: 200px;
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;          /* always percentage-based */
            background: #3772FF;
            transition: width 0.2s ease;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 20px;       /* prevents vertical shifting */
        }

        .bar span {
            width: 20px;        /* fixed label width so digits don't shift layout */
        }
    </style>
</head>

<body>
    <h1>DigitGuessr</h1>
    <p class="subtitle">Draw a digit and watch how the neural network interprets it.</p>

    <div class="pipeline">

        <div class="card">
            <h2>1. Your Drawing</h2>

            <canvas id="canvas" width="280" height="280"></canvas>

            <button onclick="clearCanvas()">Clear Canvas</button>
        </div>

        <div class="arrow">></div>

        <div class="card">
            <h2>2. Model Input</h2>

            <img
                id="processed_image"
                width="280"
                height="280">

            <p class="caption">
                28 x 28 centred grayscale image
            </p>
        </div>

        <div class="arrow">></div>

        <div class="card prediction-card">
            <h2>3. Prediction</h2>

            <div id="predictions"></div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 280, 280);

        let drawing = false;

        canvas.addEventListener("pointerdown", startDraw)
        canvas.addEventListener("pointerup", stopDraw);
        canvas.addEventListener("pointermove", draw);

        function startDraw(e) {
            drawing = true;
            canvas.setPointerCapture(e.pointerId);
            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function stopDraw(e) {
            drawing = false;
            send()
        }

        function draw(e) {
            if (!drawing) return;

            ctx.strokeStyle = "white";
            ctx.lineWidth = 20;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(lastX ?? e.offsetX, lastY ?? e.offsetY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();

            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function clearCanvas() {
            ctx.fillStyle = "black"
            ctx.fillRect(0, 0, 280, 280);
            document.getElementById("processed_image").src = "";
        }

        function renderPrediction(prediction) {
            const container = document.getElementById("predictions");
            container.innerHTML = "";

            prediction.forEach((p, i) => {
                const bar = document.createElement("div");
                bar.className = "bar";

                bar.innerHTML = `
                    <span>${i}</span>
                    <div class="track">
                        <div class="fill" style="width: ${p * 100}%"></div>
                    </div>
                `;

                container.appendChild(bar);
            });
        }

        function renderProcessed(image) {
            document.getElementById("processed_image").src = `data:image/png;base64,${image}`;
        }

        function send() {

            const image = canvas.toDataURL("image/png");

            fetch("http://127.0.0.1:8000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({image})
            })
            .then(res => res.json())
            .then(data => {
                renderPrediction(data.prediction);
                renderProcessed(data.processed_image)
            });
        }
        
    </script>
</body>
</html>
